<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE Boxing | Control Room</title><link rel="stylesheet" href="./style.css"></head><body><main class="dashboard"><header><h1>🥊 LIVE BOXING <span>CONTROL ROOM</span></h1><a href="./overlay.html" target="_blank">Open 9:16 overlay ↗</a></header><div class="layout"><section class="panel"><h2>Match setup</h2><label>Display language<select id="language"><option value="en">English</option><option value="he">עברית</option></select></label><div class="twocol"><label>Blue fighter<input id="blueName" maxlength="26" value="BIBI"></label><label>Red fighter<input id="redName" maxlength="26" value="EISENKOT"></label></div><div class="twocol"><label>Blue portrait URL (optional)<input id="blueImage" placeholder="https://..."></label><label>Red portrait URL (optional)<input id="redImage" placeholder="https://..."></label></div><label>Round length (seconds)<input id="duration" type="number" min="15" max="300" value="60"></label><div class="buttons"><button id="save">Save matchup</button><button id="start" class="primary">Start round</button><button id="reset">Reset</button></div><p class="hint">Open the overlay in another browser tab on the same computer. Settings and actions synchronize automatically.</p></section><section class="panel"><h2>Live controls</h2><div class="twocol"><button data-hit="blue">🥊 Blue punch</button><button data-hit="red">🥊 Red punch</button><button data-special="blue">⚡ Blue special</button><button data-special="red">⚡ Red special</button></div><h2>Test TikTok events</h2><div class="twocol"><button data-vote="blue">Comment 1</button><button data-vote="red">Comment 2</button><button data-gift="blue">Blue gift 🎁</button><button data-gift="red">Red gift 🎁</button></div><label>External WebSocket URL (optional)<input id="wsUrl" placeholder="ws://127.0.0.1:8765"></label><button id="connect">Connect bridge</button><p id="status" class="hint">Demo mode · no live connection</p><h2>Event log</h2><div id="log" class="log" aria-live="polite"></div></section></div><section class="panel"><h2>Preview</h2><iframe title="Live boxing overlay" src="./overlay.html"></iframe></section></main><script type="module" src="./app.js"></script></body></html>
